# The documentation site of ja4plus-go.
#
# `docs/requirements.txt` pins every generator this file needs. A build that reads a
# different version reads a different set of defaults, so the pins and this file are one
# unit. FR-documentation-8 states that rule.
#
# Build the site with `make docs`. That target runs `mkdocs build --strict`.

site_name: ja4plus-go
site_url: https://crank-git.github.io/ja4plus-go/
site_description: >-
  A Go library and command-line program for JA4+ network fingerprinting.
site_author: Crank-Git
repo_url: https://github.com/Crank-Git/ja4plus-go
repo_name: Crank-Git/ja4plus-go
edit_uri: edit/master/docs/
copyright: >-
  The original Go code is BSD 3-Clause. FoxIO licenses every method except JA4 under FoxIO
  License 1.1, which permits non-commercial use only. NOTICE holds the FoxIO terms.

# FR-documentation-3. The site reads the markdown of `docs/`.
docs_dir: docs

# FR-documentation-4. A warning fails the build. Every entry of the `validation` block
# below therefore names an error of this site, and never a note a reader may skip.
strict: true

# FR-documentation-6 and FR-documentation-7. `docs/specs/` is the spec package and
# `docs/audit/` holds the audit findings. Each one is design material, each one links
# outside `docs_dir`, and neither one is published.
#
# `exclude_docs` is the mechanism, and the two mechanisms beside it are wrong here.
#
#   - `not_in_nav` keeps the file in the built site and silences the nav warning alone.
#     The pages would publish, and their links outside `docs_dir` would still warn.
#   - The `exclude` plugin is a third-party package. MkDocs 1.5 added `exclude_docs`, so
#     the plugin adds a dependency and reaches the same result.
#
# `exclude_docs` takes a `.gitignore` pattern, it drops the file from the built site, and
# it implies `not_in_nav`.
#
# One limit is measured, and this file states it rather than claiming the opposite.
# **A link from a published page into an excluded file does not fail the build.**
# `_RelativePathTreeprocessor.path_to_url` in `mkdocs/structure/pages.py` computes
# `warning_level = min(logging.INFO, self.config.validation.links.not_found)`, so the
# message is capped at `INFO` and no value of `validation` raises it. Measured on
# 2026-08-14 at `mkdocs==1.6.1`: a page that links to `specs/spec.md` builds and exits 0.
#
# `TestNoPublishedPageLinksIntoAnExcludedDirectory` in `mkdocs_config_test.go` holds that
# gap. It reads `excludedDocumentationDirs`, so it fails when a published page links into
# `docs/specs/`, `docs/audit/`, `docs/mutation_reports/` or `docs/mutation_settlements/`.
# **The list decides the count, and this comment does not.** #92 added the fourth directory,
# and the enumeration above named three until round 59 of the `## Changelog` of
# `docs/specs/spec.md`.
#
# `docs/requirements.txt` sits under `docs_dir` because it belongs to the site, and MkDocs
# copies an unexcluded non-markdown file into the built site. The third pattern holds the
# pin list back, so the site publishes documentation alone.
#
# `docs/mutation_reports/` is the fourth pattern, and #91 added it under FR-mutation-6.
# **A mutation report is a measurement artifact, and `docs/audit/` is the precedent.** Three
# facts decide the exclusion.
#
#   1. One report names every mutation of the swept path, so it holds one table row for each.
#      The `internal/parser` report of 2026-08-14 holds 882 rows.
#   2. `make mutate` writes one report for each sweep, so the directory grows without a
#      bound. A `nav` entry for each one grows a list with no reader.
#   3. A report that no `nav` entry names reaches `validation.nav.omitted_files: warn`, and
#      `strict` above turns that warning into a failed build. So an unexcluded report breaks
#      `make docs` on the first sweep.
#
# #92 builds `docs/mutation_sweep.md`, which is published. **A link from that page into a
# report is a link into an excluded file**, and the measured gap above states that MkDocs
# does not fail it. `TestNoPublishedPageLinksIntoAnExcludedDirectory` fails it instead.
#
# `docs/mutation_settlements/` is the fifth pattern, and #92 added it under FR-mutation-13.
# **A settlement is a recorded decision, and `docs/audit/` is the precedent.** Reason 2 of
# the report exclusion above reaches it without a change. One settlement file lands for each
# sweep round, so the directory grows without a bound. A `nav` entry for each one then grows
# a list with no reader. **A settlement records why one test gained an assertion.** That is
# engineering evidence, and it is not a page a user of the library reads.
#
# `docs/mutation_sweep.md` is the published half, and it states the procedure. It names each
# record as a path in a code span, and it never links into one.
exclude_docs: |
  /specs/
  /audit/
  /requirements.txt
  /mutation_reports/
  /mutation_settlements/

# FR-documentation-5. A broken link and a broken anchor each reach `warn`, and `strict`
# above turns each warning into a failed build.
#
# `links.anchors` defaults to `info`, so the anchor half of FR-documentation-5 exists only
# because this block raises it.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

# FR-documentation-1 and FR-documentation-9.
theme:
  name: material
  language: en
  palette:
    # The light palette. It follows the reader's own setting first, and the toggle
    # overrides that setting.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to the dark palette
    # The dark palette.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to the light palette
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  # FR-documentation-10. The table-of-contents slug matches the GitHub slug, so one link
  # resolves in this site and in the GitHub blob view.
  #
  # The default slug function of `markdown.extensions.toc` does not match GitHub. It folds
  # a non-ASCII letter to ASCII, and it collapses a run of separators to one. GitHub
  # lowercases the whole string, it removes the punctuation, and it replaces each single
  # space with one hyphen.
  #
  # Measured on 2026-08-14 against `Flet/github-slugger`, which states that it generates
  # "a slug just like GitHub does for markdown headings".
  #
  #   Heading                     GitHub                  default                 this file
  #   `Rounds 1 & 2 — a re-read`  rounds-1--2--a-re-read  rounds-1-2-a-re-read    rounds-1--2--a-re-read
  #   `Café naïve résumé`         café-naïve-résumé       cafe-naive-resume       café-naïve-résumé
  #   `ÉCOLE Normale`             école-normale           ecole-normale           école-normale
  #
  # `case: lower` is the setting, and `case: lower-ascii` is wrong. `lower-ascii` lowers
  # `A` to `Z` alone, so it writes `École-normale` where GitHub writes `école-normale`.
  # The deprecated `pymdownx.slugs.gfm` alias calls `lower-ascii`, so its name misreports
  # what it does. Never adopt that alias.
  #
  # The key below is `kwds`, and `kwargs` is silently wrong. PyYAML reads `args`, `kwds`,
  # `state`, `listitems` and `dictitems`, and it drops every other key without a message.
  # A file that writes `kwargs` therefore builds, and it writes `Parity-with-the-port`
  # where GitHub writes `parity-with-the-port`. Measured on 2026-08-14.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  # The list below is short on purpose, and #85, #86 and #87 each add what a page needs.
  # Every entry here already serves a page of this branch or the code samples that every
  # later page carries.
  #
  # **`pymdownx.snippets` is absent, and no member adds it.** It embeds a file that a page
  # names, and its base path reaches outside `docs_dir`. So one `--8<--` line publishes
  # `docs/specs/` and defeats FR-documentation-6 without a warning.
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

# The navigation.
#
# The three sections below are the skeleton, and each one is filled by one later issue.
# #85 writes the prose pages, #86 writes the method pages, and #87 writes the API
# reference and the examples. Each one appends its own entries under its own heading, and
# it edits no entry of a sibling.
#
# `strict: true` accepts a section with an empty list, measured on 2026-08-14. So
# `Methods` and `Reference` hold no page today and the build still succeeds. Three members
# that append to an existing list conflict less than three members that create it.
nav:
  # #85 — the home page and the prose pages. FR-documentation-11 through
  # FR-documentation-16, FR-documentation-21 and FR-documentation-22.
  #
  # The `Guides` order runs from the first question a reader asks to the last. A reader
  # runs the program, then reads a field of the output, then asks about a live interface,
  # then shares a `Processor`. The license page sits last, and the home page links to it
  # from the first screen, because a reader must not have to reach the end to find it.
  - Home: index.md
  - Guides:
      - Usage: usage.md
      - Output schema: output-schema.md
      - Live capture: live-capture.md
      - Concurrency: concurrency.md
      - Packet throughput: throughput.md
      - Implementation notes: implementation-notes.md
      - Parity with the port: parity.md
      # #92 added this entry under FR-mutation-16. It sits last of the engineering pages,
      # because a reader reaches the test method after every question about the output.
      # The license page stays last of the section.
      - Mutation sweep: mutation_sweep.md
      - License: licensing.md
  # #86 owns every entry between this line and the `Reference` marker below.
  #
  # The order is the order that `conformanceReportMethods` of `conformance_report_test.go`
  # prints, so the site and the conformance report read the same sequence. **JA4L and JA4LS
  # each hold one page**, under FR-documentation-17, and one Go type writes both.
  - Methods:
      - Overview: methods/index.md
      - JA4: methods/ja4.md
      - JA4S: methods/ja4s.md
      - JA4H: methods/ja4h.md
      - JA4X: methods/ja4x.md
      - JA4SSH: methods/ja4ssh.md
      - JA4L: methods/ja4l.md
      - JA4LS: methods/ja4ls.md
      - JA4T: methods/ja4t.md
      - JA4TS: methods/ja4ts.md
      - JA4D: methods/ja4d.md
      - JA4D6: methods/ja4d6.md
  # #87 owns every entry between this line and the end of the file.
  #
  # The order runs from the whole surface to the parts. A reader opens the overview, then
  # the group that holds the name it wants, then the programs that call it. The overview
  # states the design decision, so it sits first. FR-documentation-19 and
  # FR-documentation-20.
  - Reference:
      - Overview: reference/index.md
      - Fingerprinters: reference/fingerprinters.md
      - Processors: reference/processors.md
      - Types and helpers: reference/types.md
      - Examples: reference/examples.md
