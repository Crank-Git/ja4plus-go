name: Release

# FR-supply-12 pins every `uses:` reference to a 40-character commit hash, because a tag
# moves and a hash does not. FR-supply-13 gives each one a trailing comment that names the
# version the hash carries.
#
# #67 resolved each hash from the GitHub API on 2026-08-13, and never from memory. The
# trailing comment names the semantic version tag that points at the same commit.
#
# No pull request runs this workflow, because a tag push is its only trigger. So CI proves
# nothing about these three pins, and the first tag after this commit is the first run
# that reads them.
on:
  push:
    tags:
      - 'v*'

# FR-supply-14 gives this workflow the least permission set that it needs.
# `contents: write` is that set, and the `Create Release` step is the one step that needs
# it. The README of `softprops/action-gh-release` states `contents: write`, and it states
# that `discussions: write` is needed for the `discussion_category_name` input. This
# workflow passes no such input, so `discussions: write` stays absent.
#
# Verified against <https://github.com/softprops/action-gh-release>, retrieved 2026-08-13.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # This workflow builds every released binary, so it names the Go version that
      # `.github/workflows/ci.yml` names. The two files held different versions until
      # 2026-08-13: CI proved that the library calls no vulnerable function, and this
      # workflow built the artifact that does. On go1.24.13, the newest Go 1.24 patch,
      # `govulncheck` v1.6.0 reported 9 called standard library vulnerabilities on
      # 2026-08-13, and 13 on 2026-08-14. No line of this repository changed between the
      # two runs, and `CLAUDE.md` states that every live figure carries its date. Each one
      # names a fix in a go1.25.x release or later, so no Go 1.24 patch clears them.
      #
      # **The range holds the patch at 1.26.6 or later, and it holds it below 1.27.**
      # GO-2026-5856 names a fix at 1.26.5, and GO-2026-6218, GO-2026-6090, GO-2026-5972
      # and GO-2026-5026 each name a fix at 1.26.6. A bare `1.26` accepts go1.26.0 through
      # go1.26.5, because `actions/setup-go` reads the tool cache of the runner before it
      # reads the release list. The comment above `jobs:` of `.github/workflows/ci.yml`
      # states the full reading, and `foundation_test.go` holds both files at one range.
      #
      # **`go.mod` does not move.** Its `go 1.24.0` directive states a language version
      # rather than a toolchain, and #438 established that reading.
      #
      # No pull request runs this workflow, because a tag push is its only trigger. So CI
      # proves nothing about this version, and the first tag after this commit is the
      # first run that reads it.
      #
      # **That trigger makes a stale range here more expensive than a stale range in CI.**
      # The cross-member review of Epic 7 measured the case on 2026-08-13. `~1.26.5` reached
      # this file, the `vuln` job of CI failed on go1.26.5, and no run reported this file at
      # all. Every released binary would carry four called standard library vulnerabilities,
      # and the tag that builds it is the first reader. So a move of the range in
      # `foundation_test.go` reads this file too.
      #
      # Verified against <https://github.com/actions/setup-go>, retrieved 2026-08-13. The
      # README states the range syntax: `SemVer version range syntax: ^1.25.1, ~1.24.1,
      # >=1.25.0-rc.1, <1.25.0, >=1.22.0 <1.24.0`.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '~1.26.6'

      - name: Run tests
        run: go test -v -race ./...

      # FR-release-35c requires every artifact to be built with `CGO_ENABLED=0`, and
      # `CLAUDE.md` `## Stack` states the same rule in prose.
      #
      # #583 measured on 2026-08-14 that the tree did not hold that rule. This job runs on
      # `ubuntu-latest`, so `GOOS=linux GOARCH=amd64` below is the runner's native pair.
      # The Go command therefore took the native default of `1` for that one build of five.
      # That artifact linked glibc dynamically where the other four are static. A user on a
      # musl distribution or in a `scratch` container met the difference.
      #
      # **No package of the default build imports cgo**, so nothing here needs the C name
      # resolver. `internal/capture/libpcap.go` does import cgo, and the `libpcap` build tag
      # keeps it out of the default build and out of every artifact below.
      #
      # **This is a step environment and never a job environment.** The `Run tests` step
      # above runs `go test -race` on the same runner, and the race detector needs cgo
      # there. Measured on 2026-08-14 for the runner's platform:
      #
      #   $ CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -race -o /dev/null ./cmd/ja4plus
      #   go: -race requires cgo
      #
      # So a job-level setting would turn the release red at the test step, and it would
      # never reach the build it was written for.
      #
      # `release_cgo_test.go` holds this shape. It asserts the setting, it asserts that
      # every artifact build sits inside this step, and it asserts that no CGO_ENABLED
      # setting sits outside it. A build appended after this step reads no setting here.
      #
      # FR-release-35d keeps the `libpcap` build tag out of every artifact. That tagged
      # path needs cgo, so this setting must not reach it and no build below passes the
      # tag.
      #
      # Verified against
      # <https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions>,
      # retrieved 2026-08-14. It states the precedence: `When more than one environment
      # variable is defined with the same name, GitHub uses the most specific variable. For
      # example, an environment variable defined in a step will override job and workflow
      # environment variables with the same name, while the step executes.`
      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-s -w -X main.Version=${VERSION}"

          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/ja4plus-linux-amd64 ./cmd/ja4plus
          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/ja4plus-linux-arm64 ./cmd/ja4plus
          # Darwin amd64
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/ja4plus-darwin-amd64 ./cmd/ja4plus
          # Darwin arm64
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/ja4plus-darwin-arm64 ./cmd/ja4plus
          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/ja4plus-windows-amd64.exe ./cmd/ja4plus

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            dist/ja4plus-*
            dist/checksums.txt
