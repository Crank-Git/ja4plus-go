name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, dev]

jobs:
  test:
    strategy:
      matrix:
        go-version: ['1.24']
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build CLI
        run: go build -o bin/ja4plus ./cmd/ja4plus

      - name: Verify CLI
        run: ./bin/ja4plus --version

  # FR-conformance-34 runs the conformance suite on every pull request this workflow
  # covers. The maintainer ruled on 2026-08-11 that the job reports and does not block.
  # #33 measured 302 matches and 1858 deviations against an empty register. A job that
  # blocks stays red on every pull request until Epic 5 closes the list, and a permanently
  # red job teaches every reader to ignore it. Epic 5 makes the job fail on a deviation.
  conformance:
    runs-on: ubuntu-latest
    # The job reads the repository and uploads an artifact. A pull request from a fork
    # controls the code this job runs, so the token gets no write scope.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # The cache key and the job summary both name the pinned commit, so read it once.
      - name: Read the corpus pin
        id: pin
        run: echo "commit=$(tr -d '[:space:]' < testdata/foxio.pin)" >> "$GITHUB_OUTPUT"

      # FR-conformance-37 keys the cache by the pinned commit. A pin move misses the cache,
      # so the next run fetches the new corpus.
      - name: Restore the corpus
        uses: actions/cache@v4
        with:
          path: testdata/foxio
          key: foxio-corpus-${{ steps.pin.outputs.commit }}

      # `make corpus` reads the FoxIO repository over the network, and it downloads nothing
      # when the cache restored the corpus. The default job bound is 360 minutes, so this
      # step carries its own bound and a stalled download cannot hold the runner.
      - name: Fetch the corpus
        timeout-minutes: 10
        run: make corpus

      # FR-conformance-36 fails the job when the corpus is absent. #33 makes the suite skip
      # in that case, and a skipped suite that reports success hides every deviation.
      - name: Verify the corpus is present
        run: |
          captures=$(find testdata/foxio/pcap -type f | wc -l | tr -d '[:space:]')
          if [ "$captures" -eq 0 ]; then
            echo "testdata/foxio/pcap holds no capture, so the conformance suite skips" >&2
            exit 1
          fi
          echo "testdata/foxio/pcap holds $captures captures."

      # The `conformance` build tag hides seven test files from every other job, so no
      # other job compiles them. `go vet` type-checks them, and a compile error fails here
      # rather than reaching the run below, which holds the exit status back.
      - name: Vet the conformance suite
        run: go vet -tags conformance ./...

      # The suite exits 2 on a deviation, and this job holds that status back, because the
      # deviation count is not the gate today. The next step reads the log and fails on
      # every other kind of failure.
      - name: Run the conformance suite
        run: |
          set -o pipefail
          status=0
          make conformance 2>&1 | tee conformance.log || status=$?
          echo "the conformance suite exited with status $status"

      # `TestConformance` is the one test that fails on a deviation. Every other failure is
      # a real defect, and the job must report it. A held-back exit status hides all of
      # them, so the job reads the log instead.
      - name: Fail on a failure that is not a deviation
        run: |
          if grep -qE '\[build failed\]|\[setup failed\]' conformance.log; then
            echo "the conformance suite did not build" >&2
            exit 1
          fi

          others=$(grep -E '^[[:space:]]*--- FAIL: ' conformance.log |
            grep -vE '^[[:space:]]*--- FAIL: TestConformance[/ ]' || true)

          if [ -n "$others" ]; then
            echo "the conformance run holds a failure that is not a deviation:" >&2
            echo "$others" >&2
            exit 1
          fi

      # The suite writes a marker line when it finds no corpus. The step above proves the
      # corpus directory holds a capture, so this check catches a skip the directory
      # check cannot see.
      #
      # The check reads the marker and not the skip message. `make conformance` runs the
      # untagged tests too, and three of them write the same skip message when one
      # capture is absent. A pin move that renames one capture would then fail this job
      # with the wrong reason. `conformance_skip_marker_test.go` holds the marker and the
      # tests that keep the two cases apart.
      - name: Fail when the conformance suite skips
        run: |
          if grep -q 'conformance-suite-skip: the corpus is absent' conformance.log; then
            echo "the conformance suite skipped, and FR-conformance-36 fails the job" >&2
            exit 1
          fi

      # A reader of the pull request reaches the job summary from the checks tab.
      #
      # A pull request from a fork controls `testdata/foxio.pin`, so the pin is untrusted
      # input. The step reads it through an environment variable, because an expression
      # that expands into the script would run the shell text the pin holds.
      - name: Publish the conformance counts
        env:
          PIN_COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          # `sed` exits 0 on an empty input, so the fallback needs the status of `grep`.
          set -o pipefail
          {
            echo "## Conformance"
            echo
            echo "The corpus is at FoxIO commit \`$PIN_COMMIT\`."
            echo
            grep -E 'the run read [0-9]+ captures|the run reports [0-9]+ matches' conformance.log |
              sed 's/^ *[^ ]*: /- /' ||
              echo "- The suite printed no summary line."
            echo
            echo "This job reports the counts. It does not fail on a deviation, and Epic 5 makes the job fail on one."
          } >> "$GITHUB_STEP_SUMMARY"

      # The log names every deviation, and Epic 5 reads it to size the work.
      - name: Upload the conformance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-log
          path: conformance.log
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # The pin holds the linter result steady. A linter release must never fail a pull
      # request that changes no code. Move this version and `.golangci.yml` together.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
